<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Anime Details | AnimeVerse</title>
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <header>

        <h1>
            AnimeVerse
        </h1>

        <a href="index.html">
            ← Home
        </a>

    </header>

    <main class="detail-page">

        <p
            id="detail-loading"
            class="detail-loading"
        >
            Loading anime details...
        </p>

        <section
            id="detail-container"
            class="detail-container"
        >

            <div class="detail-poster">

                <img
                    id="anime-image"
                    src=""
                    alt="Anime Poster"
                >

            </div>

            <div class="detail-content">

                <p class="detail-label">
                    ANIME DETAILS
                </p>

                <h2 id="anime-title">
                    Loading...
                </h2>

                <div class="detail-tags">

                    <span id="anime-type">
                        TV
                    </span>

                    <span id="anime-episodes">
                        Episodes: --
                    </span>

                    <span class="hd-tag">
                        HD
                    </span>

                    <span
                        class="score-tag"
                        id="anime-score"
                    >
                        ★ --
                    </span>

                </div>

                <div class="detail-meta">

                    <div>

                        <span>
                            Released
                        </span>

                        <strong id="anime-year">
                            --
                        </strong>

                    </div>

                    <div>

                        <span>
                            Duration
                        </span>

                        <strong id="anime-duration">
                            --
                        </strong>

                    </div>

                    <div>

                        <span>
                            Rating
                        </span>

                        <strong id="anime-rating">
                            --
                        </strong>

                    </div>

                    <div>

                        <span>
                            Rank
                        </span>

                        <strong id="anime-rank">
                            --
                        </strong>

                    </div>

                </div>

                <div class="detail-row">

                    <span>
                        Producer
                    </span>

                    <strong id="anime-producer">
                        --
                    </strong>

                </div>


        

                <div class="detail-row">

                    <span>
                        Themes
                    </span>

                    <strong id="anime-themes">
                        --
                    </strong>

                </div>

                <div class="detail-section">

                    <h3>
                        Synopsis
                    </h3>

                    <p id="anime-synopsis">
                        Loading...
                    </p>

                </div>

                <div class="detail-section">

                    <h3>
                        Background
                    </h3>

                    <p id="anime-background">
                        Loading...
                    </p>

                </div>

                <div class="detail-buttons">

                    <a
                        id="anime-url"
                        href="#"
                        target="_blank"
                        class="watch-button"
                    >
                        View Original Page ↗
                    </a>


                    <a
                        href="index.html"
                        class="back-button"
                    >
                        ← Back
                    </a>

                </div>


            </div>

        </section>

    </main>


    <script src="detail.js"></script>

</body>

</html>
